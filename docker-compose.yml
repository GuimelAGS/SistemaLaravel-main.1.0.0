services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: trainers
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: collection
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - trainer_images:/var/www/html/public/images
    command: sh -c "php artisan migrate --force && apache2-foreground"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trainers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trainers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  trainer_images: